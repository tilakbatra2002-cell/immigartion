name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Start embedded MongoDB
        run: node dev-db.mjs &
        working-directory: server

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; then
              echo "MongoDB is up"; exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not start in time"; exit 1

      - name: Seed a test environment
        run: |
          cp .env.example .env
          node scripts/create-superadmin.mjs \
            --email admin@example.com --password 'TestPass123!' --name 'CI Admin'
        working-directory: server

      - name: Start API
        run: node src/index.js &
        working-directory: server

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"; exit 1

      - name: Run smoke suite
        run: node tests/smoke.mjs
        working-directory: server
